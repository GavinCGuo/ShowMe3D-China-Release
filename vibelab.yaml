app:
  id: "7696971379161497636"
  name: ShowMe3D 空间创作
  slogan: 把模型、图像和灵感放进真实空间，创作可以走近观察的三维演示。
  description: |-
    ShowMe3D 是面向 PICO 头显的空间创作与三维演示工具。你可以将模型、图片、文字和手绘线条摆进空间，调整位置、角度和大小，用白板自由整理想法，也可以用分页演示讲清结构、过程和故事。

    每一页可以呈现不同的空间状态，配合物体动画、视点和讲解标注，让观众走近细节，从不同角度理解内容。应用内置好奇号装配、室内空间和恐龙探索示例。

    本版本无需配置 API，可使用本地资源导入、空间编辑、分页演示及内置示例。云端 AI 助手与生成功能暂未开放，相关入口显示“即将开放”。
